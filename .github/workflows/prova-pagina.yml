# Prova temporanea (da rimuovere prima del merge).
name: Prova pagina
on:
  push:
    branches: [popup-chiusura]
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium > /dev/null
      - name: Prova
        shell: python3 {0}
        run: |
          import subprocess, time
          srv = subprocess.Popen(["python3", "-m", "http.server", "8000"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          time.sleep(2)
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              br = p.chromium.launch(); pg = br.new_page(viewport={"width": 1280, "height": 800})
              errori = []; pg.on("pageerror", lambda e: errori.append(str(e)))
              pg.goto("http://localhost:8000/index.html"); pg.wait_for_timeout(6000)
              pg.click("label:has-text('Journal of Maps') input")
              pg.click("label:has-text('Geologia CARG 1:25.000 (ISPRA)') input")
              pg.evaluate("map.setView([42.35, 13.40], 13)"); pg.wait_for_timeout(5000)
              pg.mouse.click(640, 400); pg.wait_for_timeout(4000)
              print("popup aperto:", pg.query_selector(".leaflet-popup") is not None)
              pg.click("label:has-text('Geologia CARG 1:25.000 (ISPRA)') input"); pg.wait_for_timeout(800)
              print("dopo aver spento la geologia, popup ancora aperto:", pg.query_selector(".leaflet-popup") is not None)
              pg.mouse.click(640, 400); pg.wait_for_timeout(2000)
              print("nuovo clic, popup aperto:", pg.query_selector(".leaflet-popup") is not None)
              pg.click("label:has-text('Carta Geologica d') input"); pg.wait_for_timeout(800)
              print("dopo aver acceso un altro livello, popup ancora aperto:", pg.query_selector(".leaflet-popup") is not None)
              print("ERRORI:", errori); br.close()
          srv.terminate()
