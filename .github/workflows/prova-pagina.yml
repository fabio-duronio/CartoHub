# Prova temporanea della pagina (da rimuovere prima del merge).
name: Prova pagina
on:
  push:
    branches: [jom-punti-sovrapposti]
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium > /dev/null
      - name: Prova
        shell: python3 {0}
        run: |
          import subprocess, time, base64
          srv = subprocess.Popen(["python3", "-m", "http.server", "8000"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          time.sleep(2)
          from playwright.sync_api import sync_playwright
          def dump(nome, png):
              b = base64.b64encode(png).decode()
              for i in range(0, len(b), 4000):
                  print("IMG|" + nome + "|" + b[i:i+4000])
          with sync_playwright() as p:
              br = p.chromium.launch(); pg = br.new_page(viewport={"width": 1280, "height": 800})
              errori = []
              pg.on("pageerror", lambda e: errori.append(f"pageerror: {e}"))
              pg.goto("http://localhost:8000/index.html"); pg.wait_for_timeout(6000)
              print("conteggi:", pg.evaluate("""(() => { let simboli = 0, articoli = 0, gruppi = 0;
                livelli[0].layer.eachLayer(m => { simboli++; const t = m.options.title; if (t) { gruppi++; articoli += parseInt(t); } else articoli++; });
                return {simboli, gruppi, articoli}; })()"""))
              pg.click("label:has-text('Progetto CARG 1:50.000') input")
              pg.evaluate("map.setView([39.0676, 16.3475], 8)"); pg.wait_for_timeout(2500)
              pg.click("[title^='22 articoli']"); pg.wait_for_timeout(1500)
              print("voci nel popup Calabria:", pg.eval_on_selector_all(".elenco-jom li", "els => els.length"), "| prima:", pg.eval_on_selector(".elenco-jom li", "e => e.innerText.slice(0, 120)"))
              print("intestazione:", pg.inner_text(".leaflet-popup-content").split(chr(10))[0:2])
              dump("calabria", pg.screenshot(type="jpeg", quality=60))
              print("ERRORI:", errori); br.close()
          srv.terminate()
