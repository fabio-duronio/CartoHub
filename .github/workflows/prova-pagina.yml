# Prova temporanea della pagina con un browser vero (da rimuovere prima del merge).
name: Prova pagina
on:
  push:
    branches: [github-pages]
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium > /dev/null
      - name: Prova
        shell: python3 {0}
        run: |
          import subprocess, time, base64, asyncio
          srv = subprocess.Popen(["python3", "-m", "http.server", "8000"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          time.sleep(2)
          from playwright.sync_api import sync_playwright
          def dump(nome, png):
              b = base64.b64encode(png).decode()
              print(f"===IMG {nome} {len(b)}")
              for i in range(0, len(b), 4000):
                  print("IMG|" + nome + "|" + b[i:i+4000])
              print(f"===END {nome}")
          with sync_playwright() as p:
              br = p.chromium.launch()
              pg = br.new_page(viewport={"width": 1280, "height": 800})
              errori = []
              pg.on("console", lambda m: errori.append(f"{m.type}: {m.text}") if m.type in ("error", "warning") else None)
              pg.on("pageerror", lambda e: errori.append(f"pageerror: {e}"))
              pg.goto("http://localhost:8000/index.html"); pg.wait_for_timeout(6000)
              print("etichette:", pg.eval_on_selector_all(".leaflet-control-layers-overlays label", "els => els.map(e => e.innerText.trim())"))
              dump("1-italia", pg.screenshot(type="jpeg", quality=60))
              pg.click("text=Informazioni e fonti"); pg.wait_for_timeout(500)
              dump("2-info", pg.screenshot(type="jpeg", quality=60, clip={"x":0,"y":0,"width":420,"height":520}))
              pg.click("text=Informazioni e fonti")
              for t in ["Geologia CARG 1:25.000 (ISPRA)", "Geologia 1:100.000 (ISPRA)"]:
                  pg.click(f"label:has-text('{t}') input")
              pg.evaluate("map.setView([42.35, 13.40], 13)"); pg.wait_for_timeout(8000)
              dump("3-laquila", pg.screenshot(type="jpeg", quality=60))
              pg.mouse.click(640, 400); pg.wait_for_timeout(5000)
              print("popup L'Aquila:", pg.inner_text(".leaflet-popup-content") if pg.query_selector(".leaflet-popup-content") else None)
              dump("4-popup", pg.screenshot(type="jpeg", quality=60))
              pg.click("label:has-text('Progetto CARG 1:50.000') input")
              pg.click("label:has-text(\"Carta Geologica d'Italia 1:100.000\") input")
              pg.evaluate("map.closePopup(); map.setView([37.51, 13.08], 12)"); pg.wait_for_timeout(8000)
              pg.mouse.click(640, 400); pg.wait_for_timeout(5000)
              print("popup Sciacca:", pg.inner_text(".leaflet-popup-content") if pg.query_selector(".leaflet-popup-content") else None)
              dump("5-sciacca", pg.screenshot(type="jpeg", quality=60))
              pg.evaluate("map.closePopup(); map.setView([42.0, 13.5], 8)"); pg.wait_for_timeout(3000)
              print("avviso:", pg.inner_text(".avviso"))
              m = br.new_page(viewport={"width": 390, "height": 760}, device_scale_factor=1)
              m.goto("http://localhost:8000/index.html"); m.wait_for_timeout(6000)
              dump("6-mobile", m.screenshot(type="jpeg", quality=60))
              print("ERRORI:", errori)
              br.close()
          srv.terminate()
