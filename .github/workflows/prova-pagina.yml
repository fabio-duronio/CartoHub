# Prova temporanea della pagina (da rimuovere prima del merge).
name: Prova pagina
on:
  push:
    branches: [mappa-strumenti]
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium > /dev/null
      - name: Prova
        shell: python3 {0}
        run: |
          import subprocess, time, base64
          srv = subprocess.Popen(["python3", "-m", "http.server", "8000"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          time.sleep(2)
          from playwright.sync_api import sync_playwright
          def dump(nome, png):
              b = base64.b64encode(png).decode()
              for i in range(0, len(b), 4000):
                  print("IMG|" + nome + "|" + b[i:i+4000])
          with sync_playwright() as p:
              br = p.chromium.launch(); pg = br.new_page(viewport={"width": 1280, "height": 800})
              errori = []
              pg.on("pageerror", lambda e: errori.append(f"pageerror: {e}"))
              pg.on("console", lambda m: errori.append(f"{m.type}: {m.text}") if m.type == "error" else None)
              pg.on("response", lambda r: print("NOMINATIM", r.status) if "nominatim" in r.url else None)
              pg.goto("http://localhost:8000/index.html"); pg.wait_for_timeout(7000)
              print("scala:", pg.inner_text(".scala-num"), "|", pg.inner_text(".leaflet-control-scale"))
              dump("1-iniziale", pg.screenshot(type="jpeg", quality=60))
              pg.fill(".ricerca input", "Campo Imperatore"); pg.click(".ricerca button"); pg.wait_for_timeout(4000)
              print("risultati:", pg.eval_on_selector_all(".ricerca li", "els => els.map(e => e.textContent)"))
              if pg.query_selector(".ricerca li:not(.meta)"):
                  pg.click(".ricerca li:not(.meta)"); pg.wait_for_timeout(1500)
              print("dopo ricerca: zoom", pg.evaluate("map.getZoom()"), "centro", pg.evaluate("map.getCenter()"), "scala", pg.inner_text(".scala-num"))
              pg.click("label:has-text('Rilievo ombreggiato TINITALY') input"); pg.wait_for_timeout(9000)
              dump("2-tinitaly", pg.screenshot(type="jpeg", quality=60))
              pg.click("label:has-text('Geologia CARG 1:25.000 (ISPRA)') input"); pg.wait_for_timeout(8000)
              print("cursore CARG dopo geologia:", pg.eval_on_selector("[data-carg]", "e => e.value"))
              pg.eval_on_selector("[data-geo='0']", "e => { e.value = 40; e.dispatchEvent(new Event('input')); }")
              print("opacità geologia:", pg.evaluate("geologia[0].layer.options.opacity"))
              pg.wait_for_timeout(1500)
              dump("3-tinitaly-geologia40", pg.screenshot(type="jpeg", quality=60))
              pg.click("label:has-text('OpenTopoMap') input"); pg.wait_for_timeout(6000)
              dump("4-opentopo", pg.screenshot(type="jpeg", quality=60))
              pg.click("label:has-text('Satellite Sentinel-2 2016') input"); pg.wait_for_timeout(6000)
              dump("5-satellite", pg.screenshot(type="jpeg", quality=60))
              m = br.new_page(viewport={"width": 390, "height": 760})
              m.goto("http://localhost:8000/index.html"); m.wait_for_timeout(6000)
              dump("6-mobile", m.screenshot(type="jpeg", quality=60))
              print("ERRORI:", errori); br.close()
          srv.terminate()
