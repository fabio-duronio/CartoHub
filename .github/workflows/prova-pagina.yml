# Prova temporanea della pagina (da rimuovere prima del merge).
name: Prova pagina
on:
  push:
    branches: [livelli-opacita]
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium > /dev/null
      - name: Prova
        shell: python3 {0}
        run: |
          import subprocess, time, base64
          srv = subprocess.Popen(["python3", "-m", "http.server", "8000"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          time.sleep(2)
          from playwright.sync_api import sync_playwright
          def dump(nome, png):
              b = base64.b64encode(png).decode()
              for i in range(0, len(b), 4000):
                  print("IMG|" + nome + "|" + b[i:i+4000])
          with sync_playwright() as p:
              br = p.chromium.launch(); pg = br.new_page(viewport={"width": 1280, "height": 800})
              errori = []
              pg.on("pageerror", lambda e: errori.append(f"pageerror: {e}"))
              pg.on("console", lambda m: errori.append(f"{m.type}: {m.text}") if m.type == "error" else None)
              pg.goto("http://localhost:8000/index.html"); pg.wait_for_timeout(7000)
              print("sfondi:", pg.eval_on_selector_all(".leaflet-control-layers-base label", "els => els.map(e => e.innerText.trim())"))
              print("livelli:", pg.eval_on_selector_all(".leaflet-control-layers-overlays label", "els => els.map(e => e.innerText.trim())"))
              vis = lambda: pg.eval_on_selector_all(".opacita", "els => els.map(e => !e.hidden)")
              print("cursori visibili all'apertura:", vis())
              pg.evaluate("map.setView([42.35, 13.40], 13)"); pg.wait_for_timeout(3000)
              pg.click("label:has-text('Geologia CARG 1:25.000 (ISPRA)') input"); pg.wait_for_timeout(6000)
              print("dopo aver acceso la 1:25.000:", vis(), "| riempimento CARG:", pg.evaluate("(()=>{let v;livelli[1].layer.eachLayer(l=>{if(v===undefined&&l.options.fillOpacity>0)v=l.options.fillOpacity});return v})()"))
              r = pg.query_selector_all(".opacita input")
              cur = [x for x in r if x.is_visible()][0]
              cur.evaluate("e => { e.value = 40; e.dispatchEvent(new Event('input')); }")
              print("opacità 1:25.000:", pg.evaluate("geologia[0].layer.options.opacity"), "| checkbox ancora acceso:", pg.is_checked("label:has-text('Geologia CARG 1:25.000 (ISPRA)') input"))
              pg.wait_for_timeout(1500)
              dump("pannello", pg.screenshot(type="jpeg", quality=65, clip={"x": 880, "y": 0, "width": 400, "height": 420}))
              dump("mappa", pg.screenshot(type="jpeg", quality=60))
              pg.click("label:has-text('Geologia CARG 1:25.000 (ISPRA)') input"); pg.wait_for_timeout(800)
              print("dopo averla spenta:", vis(), "| riempimento CARG:", pg.evaluate("(()=>{let v;livelli[1].layer.eachLayer(l=>{if(v===undefined&&l.options.fillOpacity>0)v=l.options.fillOpacity});return v})()"))
              print("ERRORI:", errori); br.close()
          srv.terminate()
