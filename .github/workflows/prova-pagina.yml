# Prova temporanea della pagina con un browser vero (da rimuovere prima del merge).
name: Prova pagina
on:
  push:
    branches: [geologia-25k]
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium > /dev/null
      - name: Prova
        shell: python3 {0}
        run: |
          import subprocess, time, base64
          srv = subprocess.Popen(["python3", "-m", "http.server", "8000"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          time.sleep(2)
          from playwright.sync_api import sync_playwright
          def dump(nome, png):
              b = base64.b64encode(png).decode()
              for i in range(0, len(b), 4000):
                  print("IMG|" + nome + "|" + b[i:i+4000])
          with sync_playwright() as p:
              br = p.chromium.launch()
              pg = br.new_page(viewport={"width": 1280, "height": 800})
              errori = []
              pg.on("pageerror", lambda e: errori.append(f"pageerror: {e}"))
              pg.on("console", lambda m: errori.append(f"{m.type}: {m.text}") if m.type == "error" else None)
              pg.goto("http://localhost:8000/index.html"); pg.wait_for_timeout(6000)
              pg.click("label:has-text('Progetto CARG 1:50.000') input")
              pg.click("label:has-text('Journal of Maps') input")
              pg.click("label:has-text('Geologia CARG 1:25.000 (ISPRA)') input")
              for nome, (lat, lon, z) in {"aquila": (42.35, 13.40, 14), "gransasso": (42.45, 13.55, 13), "pescara": (42.46, 14.21, 14)}.items():
                  pg.evaluate(f"map.closePopup(); map.setView([{lat}, {lon}], {z})"); pg.wait_for_timeout(9000)
                  pg.mouse.click(640, 400); pg.wait_for_timeout(5000)
                  el = pg.query_selector(".leaflet-popup-content")
                  print(f"popup {nome}:", el.inner_text().replace(chr(10), " / ") if el else None)
                  pg.evaluate("map.closePopup()"); pg.wait_for_timeout(500)
                  dump(nome, pg.screenshot(type="jpeg", quality=65))
              print("ERRORI:", errori)
              br.close()
          srv.terminate()
