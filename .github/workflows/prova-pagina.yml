# Prova temporanea della pagina (da rimuovere prima del merge).
name: Prova pagina
on:
  push:
    branches: [sfondo-agea]
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium > /dev/null
      - name: Prova
        shell: python3 {0}
        run: |
          import subprocess, time, base64
          srv = subprocess.Popen(["python3", "-m", "http.server", "8000"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          time.sleep(2)
          from playwright.sync_api import sync_playwright
          def dump(nome, png):
              b = base64.b64encode(png).decode()
              for i in range(0, len(b), 4000):
                  print("IMG|" + nome + "|" + b[i:i+4000])
          with sync_playwright() as p:
              br = p.chromium.launch(); pg = br.new_page(viewport={"width": 1280, "height": 800})
              errori = []
              pg.on("pageerror", lambda e: errori.append(f"pageerror: {e}"))
              pg.goto("http://localhost:8000/index.html"); pg.wait_for_timeout(6000)
              print("sfondi:", pg.eval_on_selector_all(".leaflet-control-layers-base label", "els => els.map(e => e.innerText.trim())"))
              pg.click("label:has-text('Progetto CARG 1:50.000') input"); pg.click("label:has-text('Journal of Maps') input")
              pg.click("label:has-text('Ortofoto AGEA') input")
              for nome, (lat, lon, z) in {"campo-imperatore": (42.443, 13.56, 16), "milano": (45.464, 9.19, 15), "roma": (41.89, 12.49, 15), "italia": (41.9, 12.6, 6)}.items():
                  pg.evaluate(f"map.setView([{lat}, {lon}], {z})"); pg.wait_for_timeout(7000)
                  dump(nome, pg.screenshot(type="jpeg", quality=60))
              print("attribuzione:", pg.inner_text(".leaflet-control-attribution"))
              print("ERRORI:", errori); br.close()
          srv.terminate()
