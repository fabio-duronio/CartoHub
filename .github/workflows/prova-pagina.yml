# Prova temporanea della pagina (da rimuovere prima del merge).
name: Prova pagina
on:
  push:
    branches: [ricerca-estesa]
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium > /dev/null
      - name: Prova
        shell: python3 {0}
        run: |
          import subprocess, time, base64
          srv = subprocess.Popen(["python3", "-m", "http.server", "8000"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          time.sleep(2)
          from playwright.sync_api import sync_playwright
          def dump(nome, png):
              b = base64.b64encode(png).decode()
              for i in range(0, len(b), 4000):
                  print("IMG|" + nome + "|" + b[i:i+4000])
          with sync_playwright() as p:
              br = p.chromium.launch(); pg = br.new_page(viewport={"width": 1280, "height": 800})
              errori = []
              pg.on("pageerror", lambda e: errori.append(f"pageerror: {e}"))
              pg.on("console", lambda m: errori.append(f"{m.type}: {m.text}") if m.type == "error" else None)
              pg.on("request", lambda r: print("  -> richiesta Nominatim") if "nominatim" in r.url else None)
              pg.goto("http://localhost:8000/index.html"); pg.wait_for_timeout(6000)
              voci = lambda: pg.eval_on_selector_all(".ricerca li", "els => els.map(e => (e.className ? '[' + e.className + '] ' : '') + e.textContent).slice(0, 14)")
              for q in ["628", "Sciacca", "141", "42.3498, 13.3995", "13,3995 42,3498", "Latemar", "Chianti", "Ofioliti"]:
                  pg.fill(".ricerca input", ""); pg.type(".ricerca input", q, delay=20); pg.wait_for_timeout(700)
                  print(f"\n'{q}' (scrivendo):", voci())
              pg.fill(".ricerca input", "Sciacca"); pg.press(".ricerca input", "Enter"); pg.wait_for_timeout(3500)
              print("\n'Sciacca' + Invio:", voci())
              pg.click(".ricerca li:has-text('Foglio 628')"); pg.wait_for_timeout(2500)
              print("dopo clic foglio 628: zoom", pg.evaluate("map.getZoom()"), "| popup:", pg.inner_text(".leaflet-popup-content")[:120].replace(chr(10), " / "))
              dump("foglio628", pg.screenshot(type="jpeg", quality=60))
              pg.fill(".ricerca input", "Latemar"); pg.wait_for_timeout(700)
              pg.click(".ricerca li:not(.gruppo):not(.meta)"); pg.wait_for_timeout(2500)
              print("dopo clic Latemar: popup:", pg.inner_text(".leaflet-popup-content")[:150].replace(chr(10), " / "))
              pg.fill(".ricerca input", "42.3498, 13.3995"); pg.press(".ricerca input", "Enter"); pg.wait_for_timeout(800)
              pg.click(".ricerca li:not(.gruppo):not(.meta)"); pg.wait_for_timeout(1500)
              print("coordinate: centro", pg.evaluate("map.getCenter()"), "zoom", pg.evaluate("map.getZoom()"))
              dump("coordinate", pg.screenshot(type="jpeg", quality=60))
              print("ERRORI:", errori); br.close()
          srv.terminate()
