# Sonda temporanea sui livelli WMS della geologia 1:25.000 (da rimuovere prima del merge).
name: Sonda 25k
on:
  push:
    branches: [geologia-25k]
    paths: [".github/workflows/sonda-25k.yml"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sonda
        shell: python3 {0}
        run: |
          import urllib.request, urllib.parse, math, json, time
          H = {"User-Agent": "geologiaintasca/1.0"}
          def get(u):
              t = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=60) as r:
                      return r.status, r.read(), round(time.time() - t, 2)
              except Exception as e:
                  return "ERR", str(e).encode(), round(time.time() - t, 2)
          def merc(lon, lat):
              return lon * 20037508.34 / 180, math.log(math.tan((90 + lat) * math.pi / 360)) * 20037508.34 / math.pi
          W = "https://sinacloud.isprambiente.it/arcgisgeo/services/geo/SGI_ISPRA_Geologia25k/MapServer/WMSServer"
          R = "https://sinacloud.isprambiente.it/arcgisgeo/rest/services/geo/SGI_ISPRA_Geologia25k/MapServer"
          s, b, t = get(R + "?f=json")
          for l in json.loads(b)["layers"]:
              print("REST", l["id"], l["name"], l.get("minScale"), l.get("maxScale"), "sub:", l.get("subLayerIds"))
          for lab, (lon, lat, half) in {"L'Aquila z13": (13.40, 42.35, 0.03), "L'Aquila z11": (13.40, 42.35, 0.12), "Pescara z13": (14.21, 42.46, 0.03)}.items():
              x0, y0 = merc(lon - half, lat - half * 0.75); x1, y1 = merc(lon + half, lat + half * 0.75)
              for ly in ["0", "1", "2", "3", "4", "5", "6", "7", "0,1,2,3", "7,4"]:
                  q = urllib.parse.urlencode({"service": "WMS", "version": "1.3.0", "request": "GetMap", "layers": ly, "styles": "",
                                              "crs": "EPSG:3857", "bbox": f"{x0},{y0},{x1},{y1}", "width": 512, "height": 384,
                                              "format": "image/png", "transparent": "true"})
                  s, b, t = get(W + "?" + q)
                  print(f"GetMap {lab} L={ly}: {s} {len(b)}B {t}s")
          for lid in [2, 6, 7, 8]:
              q = urllib.parse.urlencode({"geometry": "13.30,42.30,13.50,42.40", "geometryType": "esriGeometryEnvelope", "inSR": 4326,
                                          "outFields": "*", "returnGeometry": "false", "resultRecordCount": 2, "f": "json"})
              s, b, t = get(R + f"/{lid}/query?" + q)
              j = json.loads(b) if s == 200 else {}
              print(f"REST {lid} attributi:", json.dumps([f["attributes"] for f in j.get("features", [])], ensure_ascii=False)[:600])
