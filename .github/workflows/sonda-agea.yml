# Sonda temporanea sui WMTS delle ortofoto AGEA (da rimuovere).
name: Sonda AGEA
on:
  push:
    branches: [sfondo-agea]
    paths: [".github/workflows/sonda-agea.yml"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sonda
        shell: python3 {0}
        run: |
          import urllib.request, re, time, math, json
          H = {"User-Agent": "geologiaintasca/1.0", "Referer": "https://fabio-duronio.github.io/"}
          def get(u):
              t = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=60) as r:
                      return r.status, r.headers.get("Content-Type"), r.read(), round(time.time() - t, 2)
              except Exception as e:
                  return "ERR", str(e)[:150], b"", round(time.time() - t, 2)
          def tile(lon, lat, z):
              n = 2 ** z; x = int((lon + 180) / 360 * n)
              y = int((1 - math.log(math.tan(math.radians(lat)) + 1 / math.cos(math.radians(lat))) / math.pi) / 2 * n)
              return z, y, x
          s, ct, b, t = get("https://geoportale.agea.gov.it/image/rest/services/AgEA?f=json")
          print("cartella AgEA:", s, b[:1500].decode("utf-8", "replace"))
          punti = {"Campo Imperatore (Abruzzo, 2022)": (13.56, 42.443), "Roma (Lazio, 2023)": (12.49, 41.89), "Milano (Lombardia, 2024)": (9.19, 45.464),
                   "Cagliari (Sardegna, 2022)": (9.11, 39.22), "Reggio Calabria (2024)": (15.65, 38.11), "Bologna (E-R, 2023)": (11.34, 44.49)}
          for anno in ["2022", "2023", "2024"]:
              base = f"https://geoportale.agea.gov.it/image/rest/services/AgEA/Ortofoto_AgEA_{anno}/ImageServer"
              s, ct, b, t = get(base + "?f=json")
              if s == 200:
                  j = json.loads(b)
                  print(f"\n== {anno} ImageServer:", s, "| copyright:", j.get("copyrightText"), "| desc:", (j.get("serviceDescription") or "")[:300].replace("\n", " "), "| pixel:", j.get("pixelSizeX"), "| extent:", j.get("extent"))
              else:
                  print(f"\n== {anno} ImageServer:", s, ct)
              s, ct, b, t = get(base + "/WMTS/1.0.0/WMTSCapabilities.xml")
              txt = b.decode("utf-8", "replace")
              print(" caps:", s, len(b), "| matrixsets:", sorted(set(re.findall(r"<TileMatrixSet>([^<]+)</TileMatrixSet>", txt))), "| template:", re.findall(r'template="([^"]+)"', txt)[:2], "| access:", re.findall(r"<ows:AccessConstraints>([^<]*)<", txt)[:1], re.findall(r"<ows:Fees>([^<]*)<", txt)[:1])
              tpl = (re.findall(r'template="([^"]+)"', txt) or [None])[0]
              for lab, (lon, lat) in punti.items():
                  for zz in (8, 14, 17):
                      z, y, x = tile(lon, lat, zz)
                      u = (tpl or (base + "/WMTS/tile/1.0.0/default/GoogleMapsCompatible/{TileMatrix}/{TileRow}/{TileCol}")).replace("{Style}", "default").replace("{TileMatrixSet}", "GoogleMapsCompatible").replace("{TileMatrix}", str(z)).replace("{TileRow}", str(y)).replace("{TileCol}", str(x))
                      s, ct, b, t = get(u)
                      print(f"  {lab} z{zz}: {s} {ct} {len(b)}B {t}s")
              print(" url:", u)
