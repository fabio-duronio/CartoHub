# TEMPORANEO: scarica Crossref e abstract OpenAlex per lo sviluppo. Da rimuovere prima del merge.
name: Sonda dati JoM
on:
  push:
    branches: [jom-localizzazioni]
    paths: [".github/workflows/sonda-dati.yml"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: mkdir -p out && python3 -I scripts/scarica_crossref.py out/crossref.json
      - name: OpenAlex
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.parse
          items = json.load(open("out/crossref.json"))["message"]["items"]
          out = {}
          for it in items:
              doi = it["DOI"].lower()
              url = "https://api.openalex.org/works/doi:" + urllib.parse.quote(doi) + "?select=doi,title,abstract_inverted_index,keywords,topics"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "geologiaintasca/1.0 (https://github.com/fabio-duronio/geologiaintasca)"}), timeout=30) as r:
                      w = json.load(r)
              except Exception as e:
                  out[doi] = {"errore": str(e)}; time.sleep(0.2); continue
              inv = w.get("abstract_inverted_index") or {}
              pos = sorted((p, t) for t, ps in inv.items() for p in ps)
              out[doi] = {"abstract": " ".join(t for _, t in pos)}
              time.sleep(0.15)
          json.dump(out, open("out/openalex.json", "w"), ensure_ascii=False)
          print(len(out), "record;", sum(1 for v in out.values() if v.get("abstract")), "con abstract")
          PY
      - name: Stampa i dati nel log (base64)
        run: tar czf - out | base64 -w 4000 | sed 's/^/DAT|/' 
