# Sonda temporanea: interrogazione al clic dei WMS ISPRA e CORS. Va rimossa prima del merge.
name: Sonda GetFeatureInfo
on:
  push:
    branches: [github-pages]
    paths: [".github/workflows/sonda-gfi.yml"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sonda
        shell: python3 {0}
        run: |
          import urllib.request, urllib.parse, math, time
          H = {"User-Agent": "IGC-Hub/1.0", "Origin": "https://fabio-duronio.github.io"}
          def get(u):
              t = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=60) as r:
                      return r.status, dict(r.headers), r.read(), round(time.time() - t, 2)
              except Exception as e:
                  return "ERR", {}, str(e).encode(), round(time.time() - t, 2)
          def merc(lon, lat):
              return lon * 20037508.34 / 180, math.log(math.tan((90 + lat) * math.pi / 360)) * 20037508.34 / math.pi
          B = "https://sinacloud.isprambiente.it/arcgisgeo/services/"
          punti = {"L'Aquila": (13.40, 42.35), "Pescara": (14.21, 42.46), "Sciacca": (13.08, 37.51)}
          for nome, svc, lay in [("25k", "geo/SGI_ISPRA_Geologia25k", "9,6"), ("100k", "servizi/geologica100k", "16,14")]:
              for lab, (lon, lat) in punti.items():
                  q = urllib.parse.urlencode({"geometry": f"{lon},{lat}", "geometryType": "esriGeometryPoint", "sr": 4326,
                                              "layers": "visible:" + lay, "tolerance": 3, "mapExtent": f"{lon-0.05},{lat-0.05},{lon+0.05},{lat+0.05}",
                                              "imageDisplay": "800,600,96", "returnGeometry": "false", "f": "json", "callback": "cbProva"})
                  s, h, b, t = get("https://sinacloud.isprambiente.it/arcgisgeo/rest/services/" + svc + "/MapServer/identify?" + q)
                  print(f"JSONP {nome} {lab}: {s} {h.get('Content-Type')} {t}s | {b[:1200].decode('utf-8','replace')}")

          for nome, path, layers in [("25k", "geo/SGI_ISPRA_Geologia25k/MapServer/WMSServer", ["0", "3", "0,3"]),
                                     ("100k", "servizi/geologica100k/MapServer/WMSServer", ["0", "2", "0,2"])]:
              for ly in layers:
                  for lab, (lon, lat) in punti.items():
                      x0, y0 = merc(lon - 0.01, lat - 0.01); x1, y1 = merc(lon + 0.01, lat + 0.01)
                      for fmt in ["application/geo+json", "text/html"]:
                          q = urllib.parse.urlencode({"service": "WMS", "version": "1.3.0", "request": "GetFeatureInfo", "layers": ly,
                                                      "query_layers": ly, "styles": "", "crs": "EPSG:3857", "bbox": f"{x0},{y0},{x1},{y1}",
                                                      "width": 101, "height": 101, "i": 50, "j": 50, "info_format": fmt, "feature_count": 5})
                          s, h, b, t = get(B + path + "?" + q)
                          print(f"{nome} L={ly} {lab} {fmt}: {s} CORS={h.get('Access-Control-Allow-Origin')} {t}s | {b[:500].decode('utf-8','replace')!r}")
              # GetMap CORS
              x0, y0 = merc(13.3, 42.3); x1, y1 = merc(13.5, 42.4)
              q = urllib.parse.urlencode({"service": "WMS", "version": "1.3.0", "request": "GetMap", "layers": layers[2], "styles": "",
                                          "crs": "EPSG:3857", "bbox": f"{x0},{y0},{x1},{y1}", "width": 256, "height": 256, "format": "image/png", "transparent": "true"})
              s, h, b, t = get(B + path + "?" + q)
              print(f"{nome} GetMap: {s} CORS={h.get('Access-Control-Allow-Origin')} {len(b)}B")
          # REST identify (alternativa)
          R = "https://sinacloud.isprambiente.it/arcgisgeo/rest/services/geo/SGI_ISPRA_Geologia25k/MapServer/identify?"
          q = urllib.parse.urlencode({"geometry": "13.40,42.35", "geometryType": "esriGeometryPoint", "sr": 4326, "layers": "visible:9,6",
                                      "tolerance": 3, "mapExtent": "13.3,42.3,13.5,42.4", "imageDisplay": "800,600,96", "returnGeometry": "false", "f": "json"})
          s, h, b, t = get(R + q)
          print(f"REST identify: {s} CORS={h.get('Access-Control-Allow-Origin')} {t}s | {b[:900].decode('utf-8','replace')}")
