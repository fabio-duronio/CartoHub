# Sonda temporanea su TINITALY, EOX e OpenTopoMap (da rimuovere prima del merge).
name: Sonda sfondi
on:
  push:
    branches: [mappa-strumenti]
    paths: [".github/workflows/sonda-sfondi.yml"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sonda
        shell: python3 {0}
        run: |
          import urllib.request, urllib.parse, re, time, math
          H = {"User-Agent": "geologiaintasca/1.0 (https://github.com/fabio-duronio/geologiaintasca)", "Referer": "https://fabio-duronio.github.io/geologiaintasca/"}
          def get(u, n=None):
              t = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=60) as r:
                      return r.status, r.headers.get("Content-Type"), r.read() if n is None else r.read(n), round(time.time() - t, 2), r.geturl()
              except Exception as e:
                  return "ERR", str(e)[:150], b"", round(time.time() - t, 2), u
          for pag in ["https://tinitaly.pi.ingv.it/wms_service.html", "https://tinitaly.pi.ingv.it/wmts_service.html"]:
              s, ct, b, t, _ = get(pag)
              urls = sorted(set(re.findall(rb'(?:href|src)="([^"]+)"', b)))
              print("\n==", pag, s); print([u.decode() for u in urls if b"service" in u.lower() or b"capab" in u.lower() or b"geoserver" in u.lower() or b"wms" in u.lower() or b"wmts" in u.lower()])
              for m in re.finditer(rb"https?://[^\"'<> ]+", b):
                  x = m.group(0).decode()
                  if any(k in x.lower() for k in ("wms", "wmts", "geoserver", "capab", "mapcache", "ows")): print("  url:", x)
          cand = ["https://tinitaly.pi.ingv.it/geoserver/ows?service=WMS&request=GetCapabilities",
                  "https://tinitaly.pi.ingv.it/geoserver/wms?service=WMS&request=GetCapabilities",
                  "https://tinitaly.pi.ingv.it/geoserver/gwc/service/wmts?REQUEST=GetCapabilities",
                  "https://tinitaly.pi.ingv.it/TINItaly_1_1/wms?service=WMS&request=GetCapabilities",
                  "https://tinitaly.pi.ingv.it/mapcache/wmts?SERVICE=WMTS&REQUEST=GetCapabilities"]
          for u in cand:
              s, ct, b, t, fu = get(u)
              print("\nCAND", u, s, ct, len(b), t, fu)
              if s == 200:
                  txt = b.decode("utf-8", "replace")
                  print(" layers:", sorted(set(re.findall(r"<(?:Name|ows:Identifier)>([^<]*TINI[^<]*)</", txt)))[:30])
                  print(" 3857:", "3857" in txt, "| GoogleMaps:", "GoogleMaps" in txt, "| matrixsets:", sorted(set(re.findall(r"<TileMatrixSet>([^<]+)</TileMatrixSet>", txt)))[:10])
                  print(" template:", sorted(set(re.findall(r'template="([^"]+)"', txt)))[:5])
          # EOX Sentinel-2 cloudless 2016 e OpenTopoMap
          for u in ["https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless_3857/default/g/8/94/137.jpg",
                    "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2016_3857/default/g/8/94/137.jpg",
                    "https://a.tile.opentopomap.org/8/137/94.png"]:
              s, ct, b, t, fu = get(u)
              print("TILE", u, s, ct, len(b), t)
          s, ct, b, t, fu = get("https://tiles.maps.eox.at/wmts/1.0.0/WMTSCapabilities.xml")
          txt = b.decode("utf-8", "replace")
          for m in re.finditer(r"<ows:Identifier>(s2cloudless[^<]*)</ows:Identifier>", txt): print("EOX layer:", m.group(1))
          i = txt.find("s2cloudless_3857"); print("EOX abstract:", re.sub(r"\s+", " ", txt[max(0,i-1500):i+200])[:1200])
