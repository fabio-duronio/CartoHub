<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGC-Hub – Cartografia geologica italiana</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { height: 100%; }
    .legenda { background: #fff; padding: 6px 10px; border-radius: 4px; font-size: 12px; line-height: 1.6;
               box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .legenda i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px;
                 border: 1px solid #555; }
    .leaflet-popup-content { font-size: 13px; }
    .meta { color: #555; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  const map = L.map('map').setView([42.2, 12.5], 6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap contributors'
  }).addTo(map);
  map.attributionControl.addAttribution('Fogli CARG: CARG-GATE, ISPRA (CC BY 4.0) · Confini: ISTAT (CC BY 4.0) · Metadati: Crossref');

  // Evita che testo nei dati venga interpretato come HTML
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = u => /^https:\/\//.test(u || '') ? u : '#';
  const riga = (etichetta, v) => v ? `<br><span class="meta">${etichetta}:</span> ${esc(v)}` : '';

  // Stati e colori come nella legenda di CARG-GATE (ISPRA)
  const COLORI_CARG = { 'Stampato': '#FF0000', 'In attesa di stampa': '#A87000',
                        'In allestimento per la stampa': '#FFAA00', 'Rilevamento in corso': '#A3FF73' };
  const COLORE_JOM = '#1a237e';

  function popup(feature, layer) {
    const p = feature.properties || {};
    let html = `<b>${esc(p.Title)}</b>`;
    html += riga('Descrizione', p.Description);
    html += riga('Stato', p.Stato);
    html += riga('Anno di stampa', p.Anno_stampa);
    html += riga('Coordinatori', p.Coordinatori);
    html += riga('Banca dati', p.Banca_dati);
    html += riga('Luogo', p.Type === 'Research Map' ? p.Location : null);
    html += riga('Anno', p.Anno);
    html += riga('Licenza', p.Licenza);
    if (p.Precisione) {
      const manuale = /manuale/.test(p.Fonte || '');
      const pos = p.Precisione === 'Coordinate' ? 'coordinate indicate nel paper'
        : `centroide del ${p.Precisione.toLowerCase()} ${manuale ? 'indicato dal curatore' : 'citato nel titolo'}`;
      html += riga('Posizione', pos);
    }
    const link = (u, t) => u ? `<br><a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">${t}</a>` : '';
    if (p.Type === 'Official Map') {
      if (!p.Stato) html += '<br><span class="meta">Nessuno stato indicato su CARG-GATE</span>';
      html += link(p.URL, 'Scheda su CARG-GATE') + link(p.DOI_carta, 'Carta (DOI)') + link(p.DOI_note, 'Note illustrative (DOI)');
    } else {
      html += link(p.URL, 'Apri risorsa');
    }
    layer.bindPopup(html);
  }

  const livelli = [
    { nome: 'Progetto CARG 1:50.000', file: 'dati/carg/carg_50k_fogli.geojson', colore: '#FF0000',
      opzioni: { style: f => ({ color: '#555', weight: 0.6,
                                fillOpacity: COLORI_CARG[f.properties.Stato] ? 0.45 : 0,
                                fillColor: COLORI_CARG[f.properties.Stato] || '#ffffff' }) } },
    { nome: 'Geoportali regionali', file: 'dati/geoportali_regionali/geoportali_regionali.geojson', colore: '#2e8b57',
      visibile: false,
      opzioni: { style: { color: '#2e8b57', weight: 2, fillOpacity: 0.03 } } },
    { nome: 'Journal of Maps', file: 'dati/journal_of_maps/jom_italia.geojson', colore: COLORE_JOM,
      opzioni: { pointToLayer: (f, ll) => L.circleMarker(ll, {
        radius: f.properties.Precisione === 'Regione' ? 5 : 7, color: '#fff', weight: 1,
        fillColor: COLORE_JOM, fillOpacity: f.properties.Precisione === 'Regione' ? 0.5 : 0.9 }) } }
  ];

  const controllo = L.control.layers(null, {}, { collapsed: window.innerWidth < 600 }).addTo(map);
  livelli.forEach(l => {
    fetch(l.file)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(dati => {
        const layer = L.geoJSON(dati, Object.assign({ onEachFeature: popup }, l.opzioni));
        if (l.visibile !== false) layer.addTo(map);
        controllo.addOverlay(layer, `<span style="color:${l.colore}">■</span> ${l.nome} (${dati.features.length})`);
      })
      .catch(e => console.error('Impossibile caricare', l.file, e));
  });

  const legenda = L.control({ position: 'bottomleft' });
  legenda.onAdd = () => {
    const d = L.DomUtil.create('div', 'legenda');
    d.innerHTML = '<b>Fogli CARG (stato su CARG-GATE)</b><br>' +
      Object.entries(COLORI_CARG).map(([k, c]) => `<i style="background:${c};opacity:.75"></i>${k}`).join('<br>') +
      '<br><i style="background:#fff"></i>Nessuno stato indicato' +
      `<br><b>Journal of Maps</b><br><i style="background:${COLORE_JOM};border-radius:50%"></i>comune, provincia o coordinate` +
      `<br><i style="background:${COLORE_JOM};opacity:.5;border-radius:50%"></i>solo regione`;
    return d;
  };
  legenda.addTo(map);
</script>
</body>
</html>
